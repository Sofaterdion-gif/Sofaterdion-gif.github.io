      <stop offset="0" stop-color="#080b12"/>
      <stop offset="1" stop-color="#17283a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4de6a2" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4de6a2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="960" cy="110" r="150" fill="#4de6a2" opacity=".08" filter="url(#soft)"/>
  <g opacity=".16" stroke="#93a0af">
    <path d="M70 455H1130M70 385H1130M70 315H1130M70 245H1130"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Open Bell — Market Replay</title>
  <desc id="desc">Open Bell development playtest cover with a market chart and replay controls.</desc>
  <defs>
